name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --info > test_output.log 2>&1 || {
            cat test_output.log | tail -n 200
            exit 1
          }

      - name: Push failure log to git
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          cp test_output.log ci-failure-log.txt
          git add ci-failure-log.txt
          git commit -m "ci: capture test failure log [skip ci]"
          git push -f origin ci-log

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoTrip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
